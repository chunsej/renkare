<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>蓮 - Review</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:"Yu Gothic",sans-serif;


background:

linear-gradient(
rgba(0,5,25,.9),
rgba(0,0,0,.98)
),

radial-gradient(
circle at top,
#19345c,
#000 70%
);



color:white;

min-height:100vh;


}



/* 青い月光 */

body::before{

content:"";

position:fixed;

top:0;

left:0;

width:100%;

height:100%;


background:

radial-gradient(
circle,
rgba(80,180,255,.15),
transparent 45%
);


pointer-events:none;

}



/* header */

header{

text-align:center;

padding:45px 20px 30px;

}



.logo{


font-size:32px;


letter-spacing:6px;


color:#d8f3ff;


text-shadow:


0 0 10px #00aaff,
0 0 30px white;


}



.sub{


margin-top:15px;


font-size:13px;


color:#aaa;


}






/* review */

.review-box{


width:90%;

max-width:500px;


margin:20px auto 40px;


padding:30px 25px;



background:

linear-gradient(
145deg,
rgba(0,60,120,.25),
rgba(0,0,0,.85)
);



border:

1px solid rgba(120,210,255,.8);



border-radius:20px;



box-shadow:


0 0 25px rgba(0,150,255,.3),
inset 0 0 30px rgba(0,150,255,.08);



}





/* title */

.review-title{


font-size:18px;


color:#d8f3ff;


line-height:1.8;


margin-bottom:30px;



border-bottom:


1px solid rgba(120,210,255,.4);



padding-bottom:15px;



text-shadow:


0 0 10px #00aaff;


}




/* 本文 */

.review-text{


font-size:15px;


line-height:2;


color:#eee;


min-height:350px;



}




/* cast */

.cast-info{


text-align:center;


margin-top:30px;



}




.cast-name{


font-size:32px;


color:#d8f3ff;



text-shadow:


0 0 15px #00aaff,
0 0 30px #0066ff;



}




.cast-color{


font-size:13px;


color:#aaa;


letter-spacing:3px;


}





/* back */

.back{


display:block;


width:260px;


margin:40px auto 50px;



padding:16px;



text-align:center;



border-radius:30px;



background:


linear-gradient(
90deg,
#70d7ff,
white
);



color:#001b33;



font-weight:bold;


text-decoration:none;



box-shadow:


0 0 25px #00aaff;


}



</style>


</head>


<body>




<header>


<div class="logo">

CUSTOMER VOICE

</div>



<div class="sub">

蓮 - Review

</div>


</header>







<div class="review-box">



<div class="review-title">


★★★★★<br>


東京都・20代女性の口コミ



</div>





<div class="review-text">


ここに口コミ本文を入力してください。<br><br>


例）<br>


初めは少し緊張していましたが、
落ち着いた雰囲気で優しく迎えてくれました。<br><br>


会話のひとつひとつに気遣いがあり、
自然と安心して過ごすことができました。<br><br>


大人の余裕を感じる素敵な時間で、
また特別な日に会いたいと思える方でした。




</div>





<div class="cast-info">



<div class="cast-name">

蓮

</div>


</div>



</div>








<a href="index.html" class="back">

別のキャストを選ぶ

</a>





</body>


</html>
