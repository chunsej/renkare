<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>蓮 - Review</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:"Yu Gothic",sans-serif;

background:

linear-gradient(
rgba(0,10,35,.88),
rgba(0,0,0,.96)
),

radial-gradient(
circle,
#102a55,
#000
);


color:white;

min-height:100vh;

}



/* 上部 */

header{

text-align:center;

padding:45px 20px 30px;

}



.logo{

font-size:32px;

letter-spacing:5px;

color:#b9eaff;

text-shadow:

0 0 10px #0099ff,
0 0 25px white;

}



.sub{

margin-top:15px;

font-size:13px;

color:#aaa;

}





/* 口コミカード */

.review-box{


width:90%;

max-width:500px;

margin:20px auto 40px;


padding:30px 25px;


background:

rgba(0,20,60,.75);



border:

1px solid #70d7ff;



border-radius:20px;



box-shadow:

0 0 20px rgba(0,150,255,.35);



}





/* タイトル */


.review-title{

font-size:18px;

color:#b9eaff;

line-height:1.8;

margin-bottom:30px;


border-bottom:

1px solid rgba(185,234,255,.5);


padding-bottom:15px;


}



/* 本文入力部分 */


.review-text{


font-size:15px;


line-height:2;


color:#eee;



min-height:350px;



}





.review-text span{


color:#777;


}





/* キャスト情報 */

.cast-info{


text-align:center;


margin-top:30px;


}



.cast-name{


font-size:28px;


color:#b9eaff;


text-shadow:

0 0 10px #0099ff;


}





.cast-color{


font-size:13px;

color:#aaa;


}





/* 戻るボタン */


.back{


display:block;


width:260px;


margin:40px auto 50px;


padding:16px;


text-align:center;


border-radius:30px;



background:

linear-gradient(
90deg,
#70d7ff,
white
);



color:#002040;


font-weight:bold;


text-decoration:none;



box-shadow:

0 0 20px #0099ff;


}




</style>


</head>


<body>



<header>


<div class="logo">

CUSTOMER VOICE

</div>


<div class="sub">

蓮 - Review

</div>


</header>




<div class="review-box">



<div class="review-title">


★☆☆☆☆<br>

大阪府・20代女性の口コミ


</div>



<div class="review-text">


ここに口コミ本文を入力してください。<br><br>


例）<br>

最初は少し緊張していましたが、
落ち着いた雰囲気で優しく話しかけてくれて安心しました。<br><br>

何気ない会話の中でも気遣いを感じられて、
大人の余裕を感じる素敵な時間でした。<br><br>

また特別な日に会いたいと思える方です。



</div>




<div class="cast-info">


<div class="cast-name">

蓮

</div>



</div>



</div>






<a href="index.html" class="back">

別のキャストを選ぶ

</a>




</body>


</html>
