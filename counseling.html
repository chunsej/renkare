<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Yu Gothic",sans-serif;

body{

}

header{

padding:35px 20px;

header p{

}

.container{

.card{

}

input,
select,
textarea{

padding:14px;

border:1px solid #ffd2e3;

font-size:15px;

background:#fffafb;

outline:none;

}

input:focus,
select:focus,
textarea:focus{

border-color:#ff7cad;

}

textarea{

height:120px;

resize:none;

}

button{

width:100%;

padding:18px;

margin-top:20px;

border:none;

background:linear-gradient(90deg,#ff6ea8,#ff8fc2);

color:white;

box-shadow:0 6px 15px rgba(255,105,180,.25);

button:hover{

padding:18px;
