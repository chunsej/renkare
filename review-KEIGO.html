<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>景瑚 - Review</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:"Yu Gothic",sans-serif;


background:

linear-gradient(
rgba(35,20,10,.9),
rgba(0,0,0,.98)
),

radial-gradient(
circle at top,
#60401f,
#000 70%
);



color:white;

min-height:100vh;


}




/* キャメルの怪しい光 */


body::before{

content:"";

position:fixed;


top:0;

left:0;


width:100%;


height:100%;


background:


radial-gradient(
circle,
rgba(220,170,90,.18),
transparent 45%
);



pointer-events:none;


}





/* header */


header{


text-align:center;


padding:45px 20px 30px;


}





.logo{


font-size:32px;


letter-spacing:6px;


color:#f0d2a0;



text-shadow:


0 0 10px #c08a45,
0 0 30px #8a5a20;



}



.sub{


margin-top:15px;


font-size:13px;


color:#aaa;



}





/* review */


.review-box{


width:90%;


max-width:500px;



margin:20px auto 40px;



padding:30px 25px;




background:


linear-gradient(
145deg,
rgba(120,70,20,.25),
rgba(0,0,0,.9)
);




border:


1px solid rgba(230,190,130,.8);




border-radius:20px;




box-shadow:



0 0 30px rgba(180,120,40,.3),

inset 0 0 40px rgba(200,150,80,.08);



}





/* title */


.review-title{


font-size:18px;


color:#f0d2a0;



line-height:1.8;



margin-bottom:30px;




border-bottom:



1px solid rgba(230,190,130,.5);



padding-bottom:15px;



text-shadow:


0 0 10px #c08a45;



}





/* text */


.review-text{


font-size:15px;


line-height:2;



color:#eee;



min-height:350px;


}




/* cast */


.cast-info{


text-align:center;


margin-top:30px;



}




.cast-name{


font-size:32px;


color:#f0d2a0;




text-shadow:



0 0 15px #c08a45,

0 0 35px #8a5a20;



}




.cast-color{


font-size:13px;


color:#aaa;



letter-spacing:3px;



}





/* button */


.back{


display:block;



width:260px;



margin:40px auto 50px;




padding:16px;




text-align:center;




border-radius:30px;




background:



linear-gradient(
90deg,
#d9ae75,
#fff
);




color:#301800;



font-weight:bold;




text-decoration:none;




box-shadow:



0 0 25px #c08a45;




}



</style>


</head>




<body>




<header>



<div class="logo">

CUSTOMER VOICE

</div>



<div class="sub">

景瑚 - Review

</div>


</header>






<div class="review-box">



<div class="review-title">


★☆☆☆☆<br>


大阪府・20代女性の口コミ



</div>






<div class="review-text">


ここに口コミ本文を入力してください。<br><br>


例）<br>


初めて会った時は、
少し近寄りがたい雰囲気を感じました。<br><br>


でも話してみると、とても気さくで、
何度も笑わせてもらいました。<br><br>


完璧に見える外見とのギャップが魅力的で、
気づけば夢中になっていました。<br><br>


一緒にいる時間が楽しくて、
また会いたくなる不思議な魅力があります。



</div>





<div class="cast-info">


<div class="cast-name">

景瑚

</div>


</div>



</div>






<a href="index.html" class="back">

別のキャストを選ぶ

</a>




</body>

</html>
