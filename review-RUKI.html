<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>瑠姫 - Review</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:"Yu Gothic",sans-serif;


background:

linear-gradient(
rgba(0,0,0,.88),
rgba(0,0,0,.98)
),

radial-gradient(
circle at top,
#555,
#000 65%
);



color:white;

min-height:100vh;


}



/* 背景の霧感 */

body::before{

content:"";

position:fixed;

top:0;

left:0;

width:100%;

height:100%;


background:

radial-gradient(
circle,
rgba(255,255,255,.15),
transparent 40%
);


pointer-events:none;


}



/* header */


header{

text-align:center;

padding:45px 20px 30px;

}



.logo{


font-size:32px;


letter-spacing:6px;


color:white;


text-shadow:


0 0 10px white,
0 0 30px #aaa;


}



.sub{


margin-top:15px;


font-size:13px;


color:#aaa;


}






/* review */

.review-box{


width:90%;

max-width:500px;


margin:20px auto 40px;


padding:30px 25px;



background:

linear-gradient(
145deg,
rgba(255,255,255,.12),
rgba(0,0,0,.8)
);



border:

1px solid rgba(255,255,255,.8);



border-radius:20px;



box-shadow:


0 0 25px rgba(255,255,255,.25),
inset 0 0 30px rgba(255,255,255,.05);



}





/* title */


.review-title{


font-size:18px;


color:white;


line-height:1.8;


margin-bottom:30px;



border-bottom:


1px solid rgba(255,255,255,.4);



padding-bottom:15px;



text-shadow:


0 0 10px white;


}




/* 本文 */

.review-text{


font-size:15px;


line-height:2;


color:#eee;


min-height:350px;



}




/* キャスト */

.cast-info{


text-align:center;


margin-top:30px;



}




.cast-name{


font-size:32px;


color:white;



text-shadow:


0 0 15px white,
0 0 30px #aaa;



}




.cast-color{


font-size:13px;


color:#ccc;


letter-spacing:3px;


}





/* 戻る */

.back{


display:block;


width:260px;


margin:40px auto 50px;



padding:16px;



text-align:center;



border-radius:30px;



background:


linear-gradient(
90deg,
white,
#ddd
);



color:#111;



font-weight:bold;


text-decoration:none;



box-shadow:


0 0 25px white;


}



</style>


</head>


<body>




<header>


<div class="logo">

CUSTOMER VOICE

</div>



<div class="sub">

瑠姫 - Review

</div>


</header>







<div class="review-box">



<div class="review-title">


★☆☆☆☆<br>


京都府・20代女性の口コミ



</div>





<div class="review-text">


ここに口コミ本文を入力してください。<br><br>


例）<br>


初めて会った瞬間、
本当に王子様が現れたような感覚でした。<br><br>


見た目だけではなく、
言葉遣いや細かな気遣いまで完璧で、
夢のような時間を過ごせました。<br><br>


帰る時間が近づくほど、
もっと一緒にいたいと思える素敵な方でした。




</div>





<div class="cast-info">



<div class="cast-name">

瑠姫

</div>





</div>



</div>








<a href="index.html" class="back">

別のキャストを選ぶ

</a>





</body>


</html>
