<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>一成 - Review</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:"Yu Gothic",sans-serif;


background:

linear-gradient(
rgba(35,0,0,.92),
rgba(0,0,0,.98)
),

radial-gradient(
circle at top,
#601515,
#000 70%
);



color:white;

min-height:100vh;

}




/* 赤い炎の光 */

body::before{

content:"";

position:fixed;


top:0;

left:0;


width:100%;


height:100%;


background:


radial-gradient(
circle,
rgba(255,50,50,.2),
transparent 45%
);



pointer-events:none;


}





/* header */


header{


text-align:center;


padding:45px 20px 30px;


}





.logo{


font-size:32px;


letter-spacing:6px;


color:#ffd0d0;



text-shadow:


0 0 10px #ff2222,
0 0 30px #990000;



}



.sub{


margin-top:15px;


font-size:13px;


color:#aaa;



}





/* review */


.review-box{


width:90%;


max-width:500px;



margin:20px auto 40px;



padding:30px 25px;




background:


linear-gradient(
145deg,
rgba(150,0,0,.25),
rgba(0,0,0,.92)
);




border:


1px solid rgba(255,100,100,.8);




border-radius:20px;




box-shadow:



0 0 35px rgba(255,0,0,.35),

inset 0 0 40px rgba(255,0,0,.08);



}





/* title */


.review-title{


font-size:18px;


color:#ffd0d0;



line-height:1.8;



margin-bottom:30px;




border-bottom:



1px solid rgba(255,100,100,.5);



padding-bottom:15px;



text-shadow:


0 0 10px #ff2222;



}





/* text */


.review-text{


font-size:15px;


line-height:2;



color:#eee;



min-height:350px;


}




/* cast */


.cast-info{


text-align:center;


margin-top:30px;



}




.cast-name{


font-size:32px;


color:#ffd0d0;




text-shadow:



0 0 15px #ff2222,

0 0 35px #990000;



}




.cast-color{


font-size:13px;


color:#aaa;



letter-spacing:3px;



}





/* button */


.back{


display:block;



width:260px;



margin:40px auto 50px;




padding:16px;




text-align:center;




border-radius:30px;




background:



linear-gradient(
90deg,
#ff5555,
white
);




color:#330000;



font-weight:bold;




text-decoration:none;




box-shadow:



0 0 25px #ff2222;




}



</style>


</head>




<body>




<header>



<div class="logo">

CUSTOMER VOICE

</div>



<div class="sub">

一成 - Review

</div>


</header>






<div class="review-box">



<div class="review-title">


★☆☆☆☆<br>


大阪府・20代女性の口コミ



</div>






<div class="review-text">


ここに口コミ本文を入力してください。<br><br>


例）<br>


初めて会った時から、
まっすぐな目と優しい笑顔が印象的でした。<br><br>


何事にも一生懸命向き合ってくれて、
一緒にいるだけで前向きな気持ちになれました。<br><br>


頼れる存在なのに、
ふとした瞬間に見せる素直な表情がとても可愛かったです。<br><br>


また会いたいと思える、
特別な時間をありがとうございました。



</div>





<div class="cast-info">


<div class="cast-name">

一成

</div>



  
</div>



</div>






<a href="index.html" class="back">

別のキャストを選ぶ

</a>




</body>

</html>
