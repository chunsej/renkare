<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>奨 - Review</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:"Yu Gothic",sans-serif;


background:

linear-gradient(
rgba(0,15,5,.9),
rgba(0,0,0,.98)
),

radial-gradient(
circle at top,
#174d25,
#000 70%
);



color:white;

min-height:100vh;


}



/* 緑の霧 */

body::before{

content:"";

position:fixed;

top:0;

left:0;

width:100%;

height:100%;


background:

radial-gradient(
circle,
rgba(80,255,120,.12),
transparent 45%
);


pointer-events:none;

}



/* header */

header{

text-align:center;

padding:45px 20px 30px;

}



.logo{


font-size:32px;


letter-spacing:6px;


color:#d9ffcc;


text-shadow:


0 0 10px #00ff66,
0 0 30px #66ff99;


}



.sub{


margin-top:15px;


font-size:13px;


color:#aaa;


}






/* review */

.review-box{


width:90%;

max-width:500px;


margin:20px auto 40px;


padding:30px 25px;



background:

linear-gradient(
145deg,
rgba(0,80,30,.25),
rgba(0,0,0,.85)
);



border:

1px solid rgba(100,255,140,.8);



border-radius:20px;



box-shadow:


0 0 25px rgba(0,255,100,.25),
inset 0 0 30px rgba(0,255,100,.05);



}





/* title */

.review-title{


font-size:18px;


color:#d9ffcc;


line-height:1.8;


margin-bottom:30px;



border-bottom:


1px solid rgba(100,255,140,.4);



padding-bottom:15px;



text-shadow:


0 0 10px #00ff66;


}




/* 本文 */

.review-text{


font-size:15px;


line-height:2;


color:#eee;


min-height:350px;



}




/* cast */

.cast-info{


text-align:center;


margin-top:30px;



}




.cast-name{


font-size:32px;


color:#d9ffcc;



text-shadow:


0 0 15px #00ff66,
0 0 30px #009933;



}




.cast-color{


font-size:13px;


color:#aaa;


letter-spacing:3px;


}





/* back */

.back{


display:block;


width:260px;


margin:40px auto 50px;



padding:16px;



text-align:center;



border-radius:30px;



background:


linear-gradient(
90deg,
#66ff99,
gold
);



color:#002000;



font-weight:bold;


text-decoration:none;



box-shadow:


0 0 25px #00ff66;


}



</style>


</head>


<body>




<header>


<div class="logo">

CUSTOMER VOICE

</div>



<div class="sub">

奨 - Review

</div>


</header>







<div class="review-box">



<div class="review-title">


★☆☆☆☆<br>


大阪府・20代女性の口コミ



</div>





<div class="review-text">


ここに口コミ本文を入力してください。<br><br>


例）<br>


初めて利用しましたが、
最初から優しく声をかけてくれて安心できました。<br><br>


話を聞いてくれるだけではなく、
自然に笑わせてくれるところも魅力的でした。<br><br>


落ち着いた雰囲気と温かい優しさに癒され、
帰る頃にはまた会いたいと思っていました。<br><br>


特別な時間をありがとうございました。




</div>





<div class="cast-info">



<div class="cast-name">

奨

</div>


</div>



</div>








<a href="index.html" class="back">

別のキャストを選ぶ

</a>





</body>


</html>
