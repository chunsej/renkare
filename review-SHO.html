<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>奨 - Review</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:"Yu Gothic",sans-serif;

background:

linear-gradient(
rgba(0,20,0,.85),
rgba(0,0,0,.95)
),

radial-gradient(
circle,
#123d1a,
#000
);


color:white;

min-height:100vh;

}



/* 上部 */

header{

text-align:center;

padding:45px 20px 30px;

}



.logo{

font-size:32px;

letter-spacing:5px;

color:#d4ff9a;

text-shadow:

0 0 10px #00ff66,
0 0 25px gold;

}



.sub{

margin-top:15px;

font-size:13px;

color:#aaa;

}





/* 口コミカード */

.review-box{


width:90%;

max-width:500px;

margin:20px auto 40px;


padding:30px 25px;


background:

rgba(0,30,10,.75);



border:

1px solid #5cff7a;



border-radius:20px;



box-shadow:

0 0 20px rgba(0,255,100,.3);



}





/* タイトル */


.review-title{

font-size:18px;

color:#d4ff9a;

line-height:1.8;

margin-bottom:30px;


border-bottom:

1px solid rgba(212,255,154,.5);


padding-bottom:15px;


}



/* 本文入力部分 */


.review-text{


font-size:15px;


line-height:2;


color:#eee;



min-height:350px;



}





.review-text span{


color:#777;


}





/* キャスト情報 */

.cast-info{


text-align:center;


margin-top:30px;


}



.cast-name{


font-size:28px;


color:#d4ff9a;


text-shadow:

0 0 10px #00ff66;


}





.cast-color{


font-size:13px;

color:#aaa;


}





/* 戻るボタン */


.back{


display:block;


width:260px;


margin:40px auto 50px;


padding:16px;


text-align:center;


border-radius:30px;



background:

linear-gradient(
90deg,
#d4ff9a,
gold
);



color:#002000;


font-weight:bold;


text-decoration:none;



box-shadow:

0 0 20px #00ff66;


}




</style>


</head>


<body>



<header>


<div class="logo">

CUSTOMER VOICE

</div>


<div class="sub">

奨 - Review

</div>


</header>




<div class="review-box">



<div class="review-title">


★☆☆☆☆<br>

大阪府・20代女性の口コミ


</div>



<div class="review-text">


ここに口コミ本文を入力してください。<br><br>


例）<br>

初めて利用しましたが、
最初から最後まで優しく接してくれて安心しました。<br><br>

話をしっかり聞いてくれるだけでなく、
自然に笑わせてくれるところも素敵でした。<br><br>

また会いたいと思える、
特別な時間になりました。



</div>




<div class="cast-info">


<div class="cast-name">

奨

</div>





</div>






<a href="index.html" class="back">

別のキャストを選ぶ

</a>




</body>


</html>
