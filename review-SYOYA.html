<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>翔也 - Review</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:"Yu Gothic",sans-serif;


background:

linear-gradient(
rgba(25,5,40,.92),
rgba(0,0,0,.98)
),

radial-gradient(
circle at top,
#4a3268,
#000 70%
);



color:white;

min-height:100vh;

}




/* 紫の幻想的な光 */

body::before{

content:"";

position:fixed;


top:0;

left:0;


width:100%;


height:100%;


background:


radial-gradient(
circle,
rgba(190,150,255,.2),
transparent 45%
);



pointer-events:none;


}





/* header */


header{


text-align:center;


padding:45px 20px 30px;


}





.logo{


font-size:32px;


letter-spacing:6px;


color:#eadcff;



text-shadow:


0 0 10px #b980ff,
0 0 30px #7030aa;



}



.sub{


margin-top:15px;


font-size:13px;


color:#aaa;



}





/* review */


.review-box{


width:90%;


max-width:500px;



margin:20px auto 40px;



padding:30px 25px;




background:


linear-gradient(
145deg,
rgba(100,50,160,.25),
rgba(0,0,0,.9)
);




border:


1px solid rgba(210,170,255,.8);




border-radius:20px;




box-shadow:



0 0 30px rgba(180,100,255,.35),

inset 0 0 40px rgba(180,120,255,.08);



}





/* title */


.review-title{


font-size:18px;


color:#eadcff;



line-height:1.8;



margin-bottom:30px;




border-bottom:



1px solid rgba(210,170,255,.5);



padding-bottom:15px;



text-shadow:


0 0 10px #b980ff;



}





/* text */


.review-text{


font-size:15px;


line-height:2;



color:#eee;



min-height:350px;


}




/* cast */


.cast-info{


text-align:center;


margin-top:30px;



}




.cast-name{


font-size:32px;


color:#eadcff;




text-shadow:



0 0 15px #b980ff,

0 0 35px #7030aa;



}




.cast-color{


font-size:13px;


color:#aaa;



letter-spacing:3px;



}





/* button */


.back{


display:block;



width:260px;



margin:40px auto 50px;




padding:16px;




text-align:center;




border-radius:30px;




background:



linear-gradient(
90deg,
#d5a6ff,
white
);




color:#210033;



font-weight:bold;




text-decoration:none;




box-shadow:



0 0 25px #b980ff;




}



</style>


</head>




<body>




<header>



<div class="logo">

CUSTOMER VOICE

</div>



<div class="sub">

翔也 - Review

</div>


</header>






<div class="review-box">



<div class="review-title">


★☆☆☆☆<br>


大阪府・20代女性の口コミ



</div>






<div class="review-text">


ここに口コミ本文を入力してください。<br><br>


例）<br>


初めは少し不思議な雰囲気の方だと思いましたが、
話してみるとその魅力にどんどん引き込まれました。<br><br>


好きな音楽や趣味の話で盛り上がれて、
一緒にいる時間が本当に楽しかったです。<br><br>


独特な世界観を持っているのに、
なぜか安心できる不思議な魅力があります。<br><br>


また会いたくなる特別な存在です。



</div>





<div class="cast-info">


<div class="cast-name">

翔也

</div>




</div>



</div>






<a href="index.html" class="back">

別のキャストを選ぶ

</a>




</body>

</html>
