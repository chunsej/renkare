<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>碧海 - Review</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:"Yu Gothic",sans-serif;


background:

linear-gradient(
rgba(0,0,0,.95),
rgba(0,0,0,.99)
),

radial-gradient(
circle at top,
#333,
#000 75%
);



color:white;

min-height:100vh;

}




/* 黒い影の光 */

body::before{

content:"";

position:fixed;


top:0;

left:0;


width:100%;


height:100%;


background:


radial-gradient(
circle,
rgba(150,150,150,.12),
transparent 45%
);



pointer-events:none;


}





/* header */


header{


text-align:center;


padding:45px 20px 30px;


}





.logo{


font-size:32px;


letter-spacing:6px;


color:#eee;



text-shadow:


0 0 10px white,
0 0 30px #555;



}



.sub{


margin-top:15px;


font-size:13px;


color:#888;



}





/* review */


.review-box{


width:90%;


max-width:500px;



margin:20px auto 40px;



padding:30px 25px;




background:


linear-gradient(
145deg,
rgba(80,80,80,.2),
rgba(0,0,0,.95)
);




border:


1px solid rgba(180,180,180,.6);




border-radius:20px;




box-shadow:



0 0 35px rgba(255,255,255,.15),

inset 0 0 50px rgba(255,255,255,.03);



}





/* title */


.review-title{


font-size:18px;


color:#eee;



line-height:1.8;



margin-bottom:30px;




border-bottom:



1px solid rgba(255,255,255,.3);



padding-bottom:15px;



text-shadow:


0 0 10px white;



}





/* text */


.review-text{


font-size:15px;


line-height:2;



color:#ddd;



min-height:350px;


}




/* cast */


.cast-info{


text-align:center;


margin-top:30px;



}




.cast-name{


font-size:32px;


color:#fff;




text-shadow:



0 0 15px white,

0 0 35px #555;



}




.cast-color{


font-size:13px;


color:#777;



letter-spacing:3px;



}





/* button */


.back{


display:block;



width:260px;



margin:40px auto 50px;




padding:16px;




text-align:center;




border-radius:30px;




background:



linear-gradient(
90deg,
#333,
white
);




color:#000;



font-weight:bold;




text-decoration:none;




box-shadow:



0 0 25px white;




}



</style>


</head>




<body>




<header>



<div class="logo">

CUSTOMER VOICE

</div>



<div class="sub">

碧海 - Review

</div>


</header>






<div class="review-box">



<div class="review-title">


★☆☆☆☆<br>


大阪府・20代女性の口コミ



</div>






<div class="review-text">


ここに口コミ本文を入力してください。<br><br>


例）<br>


最初は少し怖そうな印象でしたが、
話した瞬間にそのイメージが変わりました。<br><br>


見た目とのギャップがすごくて、
気づけば何度も笑わせてもらっていました。<br><br>


普段はクールなのに、
ふと見せる優しさや素直な一面が忘れられません。<br><br>


強そうに見えて実は寂しがり屋なところも、
魅力のひとつだと思います。



</div>





<div class="cast-info">


<div class="cast-name">

碧海

</div>



</div>



</div>






<a href="index.html" class="back">

別のキャストを選ぶ

</a>




</body>

</html>
