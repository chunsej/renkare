<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GLAMOUR MEMBERS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:"Yu Gothic","Hiragino Sans",sans-serif;

    background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.80)),
    url("https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1400&q=80");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    color:white;

}

header{

    text-align:center;
    padding:40px 20px 30px;

}

header h1{

    font-size:36px;
    color:#FFD700;
    letter-spacing:4px;
    text-shadow:0 0 15px gold;

}

header p{

    margin-top:12px;
    color:#dddddd;
    font-size:15px;
    line-height:1.8;

}

.member-list{

    width:100%;
    max-width:420px;

    margin:0 auto;

    padding:20px;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:12px;

}

.member{

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,215,0,.3);

    border-radius:15px;

    overflow:hidden;

    backdrop-filter:blur(8px);

    transition:.3s;

    box-shadow:0 0 12px rgba(255,215,0,.2);

}

.member:hover{

    transform:translateY(-5px);

    box-shadow:0 0 20px gold;

}

.member a{

    text-decoration:none;
    color:white;

}

.member img{

    width:100%;

    aspect-ratio:3/4;

    object-fit:cover;

    display:block;

}

.member-name{

    padding:10px 5px;

    text-align:center;

    font-size:15px;

    font-weight:bold;

    letter-spacing:1px;

}

footer{

    text-align:center;

    padding:30px;

    color:#bbbbbb;

    font-size:12px;

}

</style>

</head>
