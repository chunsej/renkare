<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>PREMIUM CAST</title>



<style>


*{

margin:0;

padding:0;

box-sizing:border-box;

}



body{

font-family:
"Yu Gothic",
sans-serif;


background:

linear-gradient(
180deg,
#050505,
#1a0008
);


color:white;


}



/* ヘッダー */

header{


text-align:center;


padding:50px 20px 30px;


}



.logo{


font-size:38px;


letter-spacing:6px;


color:#ffd700;


text-shadow:

0 0 10px gold,
0 0 30px #ff9900;


}



.subtitle{


margin-top:15px;


color:#ddd;


font-size:14px;


}





/* キャスト一覧 */

.cast-list{


display:grid;


grid-template-columns:
repeat(3,1fr);


gap:12px;


padding:15px;


}





/* カード */


.cast-card{


text-decoration:none;


color:white;


opacity:0;


transform:translateY(40px);


transition:

0.8s;


}



.cast-card.show{


opacity:1;


transform:translateY(0);


}




.photo-box{


position:relative;


border-radius:15px;


overflow:hidden;


background:#222;


}





.photo-box img{


width:100%;


aspect-ratio:3/4;


object-fit:cover;


display:block;


}





/* 名前 */

.name{


text-align:center;


margin-top:8px;


font-size:17px;


font-weight:bold;


}





.catch{


text-align:center;


font-size:10px;


color:#ddd;


margin-top:5px;


}





/* バッジ */


.badge{


position:absolute;


top:8px;


left:8px;


padding:5px 8px;


border-radius:20px;


font-size:10px;


font-weight:bold;


background:

linear-gradient(
45deg,
gold,
white
);


color:#7a4500;


}





/* 色枠 */


.green .photo-box{

border:3px solid #7dff8a;

box-shadow:
0 0 15px #00ff66;

}



.blue .photo-box{

border:3px solid #70d7ff;

box-shadow:
0 0 15px #0099ff;

}



.white .photo-box{

border:3px solid white;

box-shadow:
0 0 15px gold;

}



.sky .photo-box{

border:3px solid #8eeaff;

box-shadow:
0 0 15px #00ccff;

}



.camel .photo-box{

border:3px solid #d9ae75;

box-shadow:
0 0 15px #b57a35;

}



.pink .photo-box{

border:3px solid #ff9fc8;

box-shadow:
0 0 15px #ff69b4;

}



.purple .photo-box{

border:3px solid #d5a6ff;

box-shadow:
0 0 15px #a855f7;

}



.black .photo-box{

border:3px solid #888;

box-shadow:
0 0 20px black;

}



.red .photo-box{

border:3px solid #ff5555;

box-shadow:
0 0 15px red;

}





/* footer */


footer{


text-align:center;


padding:40px;


color:#aaa;


font-size:12px;


}



</style>


</head>




<body>





<header>


<div class="logo">

PREMIUM CAST

<div class="subtitle">

あなたの特別な時間を彩る9人

<script>


const cards =
document.querySelectorAll(".cast-card");



const observer =
new IntersectionObserver(entries=>{


entries.forEach(entry=>{


if(entry.isIntersecting){


entry.target.classList.add("show");


}


});


});



cards.forEach(card=>{

observer.observe(card);


});



</script>
