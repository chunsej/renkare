<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>純喜 - Review</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:"Yu Gothic",sans-serif;

background:

linear-gradient(
rgba(0,15,25,.92),
rgba(0,0,0,.98)
),

radial-gradient(
circle at top,
#164052,
#000 70%
);


color:white;

min-height:100vh;

}



/* 青い怪しい光 */

body::before{

content:"";

position:fixed;

top:0;

left:0;

width:100%;

height:100%;


background:

radial-gradient(
circle,
rgba(0,220,255,.15),
transparent 45%
);


pointer-events:none;

}



/* header */

header{

text-align:center;

padding:45px 20px 30px;

}


.logo{

font-size:32px;

letter-spacing:6px;

color:#c8f8ff;


text-shadow:

0 0 10px #00ddff,
0 0 30px #0088aa;

}


.sub{

margin-top:15px;

font-size:13px;

color:#aaa;

}




/* review */

.review-box{

width:90%;

max-width:500px;


margin:20px auto 40px;


padding:30px 25px;



background:


linear-gradient(
145deg,
rgba(0,120,160,.2),
rgba(0,0,0,.9)
);



border:

1px solid rgba(100,230,255,.8);



border-radius:20px;



box-shadow:


0 0 30px rgba(0,220,255,.3),
inset 0 0 40px rgba(0,200,255,.08);


}





/* title */

.review-title{

font-size:18px;

color:#c8f8ff;


line-height:1.8;


margin-bottom:30px;


border-bottom:


1px solid rgba(100,230,255,.5);



padding-bottom:15px;


text-shadow:

0 0 10px #00ddff;


}





/* text */

.review-text{

font-size:15px;

line-height:2;


color:#eee;


min-height:350px;

}





/* cast */

.cast-info{

text-align:center;

margin-top:30px;

}


.cast-name{

font-size:32px;

color:#c8f8ff;


text-shadow:

0 0 15px #00ddff,
0 0 35px #006677;


}



.cast-color{

font-size:13px;

color:#aaa;

letter-spacing:3px;

}




/* button */

.back{


display:block;


width:260px;


margin:40px auto 50px;


padding:16px;


text-align:center;


border-radius:30px;


background:


linear-gradient(
90deg,
#8eeaff,
#ffffff
);



color:#002533;


font-weight:bold;


text-decoration:none;



box-shadow:


0 0 25px #00ddff;


}



</style>


</head>



<body>



<header>


<div class="logo">

CUSTOMER VOICE

</div>


<div class="sub">

純喜 - Review

</div>


</header>





<div class="review-box">


<div class="review-title">

★☆☆☆☆<br>

大阪府・20代女性の口コミ


</div>




<div class="review-text">


ここに口コミ本文を入力してください。<br><br>


例）<br>


最初は明るく元気な方という印象でしたが、
一緒に過ごすほど深い優しさを感じました。<br><br>


どんな時でも真剣に向き合ってくれて、
こちらが落ち込んでいる時には本気で心配してくれる姿が印象的でした。<br><br>


笑顔だけではなく、
時折見せる真剣な表情とのギャップに惹かれました。<br><br>


また会いたいと思える特別な存在です。



</div>





<div class="cast-info">


<div class="cast-name">

純喜

</div>



</div>



</div>






<a href="index.html" class="back">

別のキャストを選ぶ

</a>




</body>

</html>
