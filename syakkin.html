<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>infinity Card</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Yu Gothic",sans-serif;
}

body{
background:#f5f5f5;
color:#333;
}

.header{
background:#fff;
padding:18px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:46px;
height:46px;
background:#1976d2;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:28px;
font-weight:bold;
}

.title{
font-size:24px;
font-weight:bold;
}

.card{
background:#fff;
margin:18px;
border-radius:16px;
padding:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
font-size:30px;
margin-bottom:18px;
}

p{
line-height:1.8;
font-size:16px;
}

.limit{
margin-top:20px;
background:#eef7ff;
padding:18px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;
font-size:18px;
font-weight:bold;
}

.label{
margin-top:30px;
font-size:18px;
margin-bottom:10px;
}

input{
width:100%;
padding:18px;
font-size:28px;
border:none;
border-bottom:2px solid #ccc;
background:#fff;
outline:none;
}

.small{
font-size:13px;
color:#777;
margin-top:8px;
}

button{
width:100%;
margin-top:35px;
padding:18px;
font-size:20px;
font-weight:bold;
background:#1976d2;
color:#fff;
border:none;
border-radius:14px;
cursor:pointer;
}

button:hover{
background:#1565c0;
}

</style>
</head>

<body>

<div class="header">
<div class="logo">D</div>
<div class="title">infinity Card</div>
</div>

<div class="card">

<h2>ネットキャッシングのお申し込み</h2>

<p>
借入希望額をご登録のお支払い口座へお振込みします。<br>
ご利用可能額の範囲内で借入希望額をご入力ください。
</p>

<div class="limit">
<span>ご利用可能額</span>
<span>300,000円</span>
</div>

<div class="label">借入希望額</div>

<input type="number" placeholder="例）100,000円">

<div class="small">
10,000円以上、1,000円単位で入力してください
</div>

<button onclick="location.href='review-TAKUMI2.html'">
申し込む
</button>

</div>

</body>
</html>
